name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 Flet 自动安装的 Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flet-flutter-${{ runner.os }}-1.1.2

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: 安装 Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 构建 APK
        run: |
          flet build apk . \
            --project checkin_app \
            --bundle-id com.example.checkin \
            --product "打卡任务栏" \
            --artifact checkin \
            --build-version 0.1.0 \
            --build-number "${{ github.run_number }}" \
            --yes \
            --verbose

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: checkin-apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 30
